<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>RF Map</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
}

#map {
    height: 100vh;
}

.info {
    position: absolute;
    top: 10px;
    left: 10px;
    z-index: 1000;
    background: white;
    padding: 10px;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0,0,0,0.2);
}

/* Label CPE dan SITE */
.cpe-label {
    background: white;
    border: 1px solid red;
    color: red;
    font-weight: bold;
    font-size: 12px;
    padding: 2px 6px;
    border-radius: 4px;
}

.site-label {
    background: white;
    border: 1px solid green;
    color: green;
    font-weight: bold;
    font-size: 12px;
    padding: 2px 6px;
    border-radius: 4px;
}

/* Hilangkan ekor tooltip */
.cpe-label::before,
.site-label::before {
    display: none !important;
}
</style>

</head>

<body>

<div class="info">
    <div><b>CPE → Site</b></div>
    <div id="distance"></div>
    <div id="bearing"></div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// ===============================
// GET COORDINATE FROM URL
// ===============================

const p = new URLSearchParams(window.location.search);

const clat = parseFloat(p.get("clat") || -7.0489684);
const clon = parseFloat(p.get("clon") || 110.42617);

const slat = parseFloat(p.get("slat") || -7.05159);
const slon = parseFloat(p.get("slon") || 110.42708);

const cpe = [clat, clon];
const site = [slat, slon];


// ===============================
// MAP
// ===============================

const map = L.map("map");

L.tileLayer(
    "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap contributors"
    }
).addTo(map);


// ===============================
// CPE - RED
// ===============================

L.circleMarker(cpe, {
    radius: 9,
    color: "white",
    weight: 3,
    fillColor: "red",
    fillOpacity: 1
})
.addTo(map)
.bindTooltip("CPE", {
    permanent: true,
    direction: "right",
    offset: [10, 0],
    className: "cpe-label"
});


// ===============================
// SITE - GREEN
// ===============================

L.circleMarker(site, {
    radius: 9,
    color: "white",
    weight: 3,
    fillColor: "green",
    fillOpacity: 1
})
.addTo(map)
.bindTooltip("SITE", {
    permanent: true,
    direction: "right",
    offset: [10, 0],
    className: "site-label"
});


// ===============================
// LINE CPE → SITE
// ===============================

L.polyline(
    [cpe, site],
    {
        color: "red",
        weight: 3
    }
).addTo(map);


// ===============================
// FIT MAP
// ===============================

map.fitBounds(
    [cpe, site],
    {
        padding: [80, 80],
        maxZoom: 18
    }
);


// ===============================
// DISTANCE
// ===============================

function distance(lat1, lon1, lat2, lon2) {

    const R = 6371;

    const dLat =
        (lat2 - lat1) * Math.PI / 180;

    const dLon =
        (lon2 - lon1) * Math.PI / 180;

    const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(lat1 * Math.PI / 180) *
        Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLon / 2) ** 2;

    return R * 2 * Math.atan2(
        Math.sqrt(a),
        Math.sqrt(1 - a)
    );
}


// ===============================
// BEARING
// ===============================

function bearing(lat1, lon1, lat2, lon2) {

    const y =
        Math.sin(
            (lon2 - lon1) * Math.PI / 180
        ) *
        Math.cos(lat2 * Math.PI / 180);

    const x =
        Math.cos(lat1 * Math.PI / 180) *
        Math.sin(lat2 * Math.PI / 180)
        -
        Math.sin(lat1 * Math.PI / 180) *
        Math.cos(lat2 * Math.PI / 180) *
        Math.cos(
            (lon2 - lon1) * Math.PI / 180
        );

    return (
        Math.atan2(y, x) * 180 / Math.PI + 360
    ) % 360;
}


// ===============================
// CALCULATE
// ===============================

const km =
    distance(clat, clon, slat, slon);

const brg =
    bearing(clat, clon, slat, slon);


// ===============================
// DISPLAY
// ===============================

document.getElementById("distance").innerHTML =
    "Distance: " + km.toFixed(3) + " km";

document.getElementById("bearing").innerHTML =
    "Bearing: " + brg.toFixed(1) + "°";

</script>

</body>
</html>
